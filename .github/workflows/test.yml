name: Standalone regression tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pytest-asyncio aiohttp requests ruff
      - run: python -m compileall -q custom_components
      - run: ruff check custom_components tests
      - run: python -m pytest tests/unit -q
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install pytest-homeassistant-custom-component==0.13.375 requests
      - run: python -m pytest tests/ha -q
  hacs-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: description topics
