name: Basic checks
on:
  push:
  pull_request:
jobs:
  syntax-and-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q custom_components
      - run: python -m unittest discover -s tests -v
